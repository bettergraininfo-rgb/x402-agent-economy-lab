name: integration

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"  # daily 15:00 UTC

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv --clear .venv
          uv pip install --python .venv/bin/python fastapi "uvicorn[standard]" httpx x402 cdp-sdk

      - name: Run full integration suite
        run: bash ci.sh

      - name: Summary
        if: always()
        run: |
          echo "## x402 Agent Economy Lab — CI" >> $GITHUB_STEP_SUMMARY
          echo "Protocol flows, dynamic pricing, live Base data, A2A commerce." >> $GITHUB_STEP_SUMMARY
