name: funding-probe
# Probe every known funding source FROM a GitHub runner (open internet),
# dump raw responses so we can adapt. Read-only diagnostics, safe to re-run.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe funding sources
        run: |
          WALLET="0xdC0750D5fB649bab3B8b02d31CDab12Dcae0cC51"
          SOL="RK279cyTYhNWevv1xhHW4hWnpQ2V9vy4U5kGt4p6TRs"

          echo "=== 1. Circle faucet API (USDC on base-sepolia) ==="
          curl -s -o /tmp/c.json -w "http=%{http_code}\n" --max-time 20 \
            -X POST https://faucet.circle.com/api/faucet \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64; rv:130.0) Gecko/20100101 Firefox/130.0" \
            -H "Origin: https://faucet.circle.com" \
            -H "Referer: https://faucet.circle.com/" \
            -d "{\"address\":\"$WALLET\",\"asset\":\"USDC\",\"network\":\"base-sepolia\"}"
          head -c 300 /tmp/c.json; echo

          echo "=== 2. Solana web faucet w/ browser headers ==="
          curl -s -o /tmp/s.json -w "http=%{http_code}\n" --max-time 20 \
            -X POST https://faucet.solana.com/api/request-airdrop \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64; rv:130.0) Gecko/20100101 Firefox/130.0" \
            -H "Origin: https://faucet.solana.com" \
            -d "{\"wallet\":\"$SOL\",\"amount\":100000000}"
          head -c 300 /tmp/s.json; echo

          echo "=== 3. PoW faucet (mine-for-ETH) reachability ==="
          curl -s -o /dev/null -w "pk910 http=%{http_code}\n" --max-time 15 \
            https://sepolia-faucet.pk910.de/

          echo "=== 4. Other EVM faucet APIs ==="
          for u in "https://api.zan.top/faucet/v1/sepolia" \
                   "https://faucet.polygon.technology/api/v2/get-tokens"; do
            code=$(curl -s -o /tmp/x.json -w "%{http_code}" --max-time 12 "$u")
            echo "$u -> $code $(head -c 120 /tmp/x.json)"
          done

          echo "=== 5. Base Sepolia direct RPC check ==="
          curl -s --max-time 15 -X POST https://sepolia.base.org \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' | head -c 150; echo
